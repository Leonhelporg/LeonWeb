<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Leon Web 工具页：提交建议。"><title>提交建议 - Leon Web 工具页</title><link rel="stylesheet" href="index.css"></head><body><header class="site-header"><div class="wrap header-inner"><a href="index.html" class="brand"><span class="brand-dot"></span><span>Leon Web</span></a><nav class="nav"><a href="index.html">首页</a><a href="xiangmu.html">案例</a><a href="index.html#contact">联系</a></nav></div></header><main class="wrap"><section class="hero-personal"><div class="hero-main"><p class="kicker">Tool Page</p><h1>提交建议</h1><p class="lead">用于提交反馈建议，保留原 Worker 提交功能，并统一为官网 UI。</p></div><aside class="profile-card"><p class="profile-title">状态</p><p>功能可用，提交后由接口返回结果。</p></aside></section><section class="section tool-panel"><h2>提交建议</h2><form id="suggestionForm"><textarea id="suggestion" placeholder="请输入您的建议..." required></textarea><button type="submit" class="btn btn-primary">提交</button></form><div class="response" id="response"></div></section></main><script>document.getElementById('suggestionForm').addEventListener('submit',async function(e){e.preventDefault();var r=document.getElementById('response');var s=document.getElementById('suggestion').value;r.textContent='正在提交...';try{var res=await fetch('https://morning-snow-5502.leonhelp999-org.workers.dev/submit-suggestion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({suggestion:s})});var d=await res.json();r.textContent=d.message||'提交成功';}catch(err){r.textContent='提交失败: '+err;}});</script>    <script src="site.js"></script>
</body></html>
